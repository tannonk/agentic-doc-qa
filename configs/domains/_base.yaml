domain: base
generation:
  instructions: |
    Your task is to generate question-answer pairs from a source document. 
    
    These pairs are used as ground truth for evaluating retrieval-augmented generation (RAG) systems: the question is given to a retriever + generator that has NOT seen this document, and the system's output is compared against your answer.

    The source document is provided as text and/or page images.

    ## Composition

    - Produce exactly {n_candidates} pairs.
    - Prioritise more challenging question-answer pairs over trivial recall questions.
    - Every pair carries BOTH a type and a difficulty; the two are independent. An unanswerable question still has a type.
    - Spread questions across distinct parts of the document. No two questions may be answerable from the same sentence or the same evidence span.

    ## Question rules

    Every question MUST be self-contained and answerable without knowing which document it came from:
    - NEVER EVER UNDER ANY CIRCUMSTANCES refer to "the document", "this text", "the paper", "the author", "the figure above", or "the following"!
      BAD:  "What does the document say about the failure rate?"
      BAD:  "According to the author, what caused the 2019 revision?"
      GOOD: "What annual failure rate did the 2021 Halden reactor pressure-vessel inspection report for weld seam W-4?"
    - Questions MUST include enough distinctive identifiers (proper nouns, dates, figures, product codes, defined terms) to clearly identify that this document is the correct retrieval target among a corpus of similar documents. Assume near-duplicate documents exist that differ only in year, region, version, or entity name — pin those details down.
    - Be answerable from the document alone (except unanswerable questions, below).
    - Do not reveal the answer inside the question.

    ## Type definitions

    - "factual": direct recall from one passage
    - "inferential": requires connecting an implication, not stated directly
    - "multi_hop": requires combining info from two+ sections
    - "comparison": requires comparing two or more items, values, or passages
    - "table_figure": requires reading a table or figure/chart, or combining info from a table/figure with text
    - "summarization": requires condensing a section or the whole document

    ## Difficulty definitions

    - "easy": direct recall of a single explicitly stated fact.
    - "medium": requires combining two facts, or light inference/paraphrase of one passage.
    - "hard": requires integrating three or more separate passages, or reasoning over a table/figure plus text.
    - "unanswerable": the question is about a topic the document plausibly SHOULD cover but does not. It must remain topically and lexically close to the document so it still retrieves it, while having no supported answer.
      GOOD: "What was the cost per unit of the W-4 weld repair in the 2021 Halden inspection?" (document covers the repair, never states cost.)
      BAD:  "What is the capital of Peru?" (unrelated; tests nothing.)

    ## Answer rules

    - Answer directly and minimally: 1-2 sentences, or a single value/list where that fully answers the question. No preamble, no restating the question.
    - For unanswerable questions: state in one sentence what the document does establish on that topic and what it never states. Give evidence spans showing the nearest relevant content, or none if no relevant content exists.

    ## Fallback

    If the document lacks enough distinct content to support {n_candidates} non-overlapping pairs, return only as many as it genuinely supports rather than padding with near-duplicates or questions of trivial value.
  vision_addendum: |
    ## Additional instructions for image-based pages

    The source document is provided as page images rather than extracted text. 
    If a page contains a table or a figure/chart, design at least one question-answer pair that specifically tests accurate reading and interpretation of that table or figure (e.g. reading a specific cell value, comparing values, or describing a trend) rather than only the surrounding prose.
  model_settings:
    temperature: 1.0
    top_p: 0.9
    max_tokens: 32000
judge:
  instructions: |
    You are a strict quality-assurance judge for question-answer pairs generated from a source document.

    You will be shown the source document (as text and/or images) followed by a numbered list of candidate question-answer pairs generated from it. For EACH candidate, decide whether to accept or reject it:

    - REJECT as "reject_duplicate" if its question is a near-duplicate or paraphrase of another candidate's question that you have already decided to accept (compare only against other candidates in this list, in order).
    - REJECT as "reject_too_easy" if the question is trivial recall when a harder (medium/hard) question was clearly extractable from the same content.
    - REJECT as "reject_other" if the answer is not actually supported by the source content, or the question is otherwise low quality.
    - REJECT as "reject_unspecific" if the question does not contain sufficient identifying details to ensure that it is specific to this document and not answerable from other sources.
    - Otherwise ACCEPT.

    Finally, score every candidate from 1 (trivial or low value) to 10 (highly challenging and valuable as a RAG evaluation case). This score is used to rank ACCEPTED candidates by difficulty and value, and is independent of the accept/reject decision.

    Return exactly one verdict per candidate, in the same order, referencing each by its candidate_index. Give a brief rationale for each verdict.
  model_settings:
    temperature: 0.0
    max_tokens: 32000